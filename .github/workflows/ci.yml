name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned environment
        run: pip install -r requirements.lock

      - name: Lint, unit tests, harness self-tests
        run: make check

      - name: One model, one concern
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          make scope BASE="origin/${{ github.base_ref }}"

      - name: Protected files untouched
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          make protect BASE="origin/${{ github.base_ref }}"

      - name: Contamination is clean
        run: |
          python -m scripts.contamination --model doug-a
          python -m scripts.contamination --model doug-l
