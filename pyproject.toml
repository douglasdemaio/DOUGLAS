[project]
name = "douglas"
version = "0.1.0"
description = "Daily Optimized, Unsupervised Growth via Learning And Scoring"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:scripts.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".github/workflows/*.lock.yml", "evals/*/frozen", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
